apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    def hostIsWindows = System.getProperty("os.name").startsWith("Windows")
    def hermesExecutable = hostIsWindows ? "hermesc.exe" : "hermesc"
    hermesCommand = new File(reactNativeDir.get().asFile, "sdks/hermesc/%OS-BIN%/${hermesExecutable}").absolutePath
    autolinkLibrariesWithApp()
}

android {
    namespace "com.focusnotes"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.focusnotes"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.1.1"
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def props = rootProject.ext.signingProps
            storeFile file(props.getProperty("FN_RELEASE_STORE_FILE", "focusnotes-release.jks"))
            storePassword props.getProperty("FN_RELEASE_STORE_PASSWORD", "")
            keyAlias props.getProperty("FN_RELEASE_KEY_ALIAS", "focusnotes")
            keyPassword props.getProperty("FN_RELEASE_KEY_PASSWORD", "")
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        }
        qa {
            initWith debug
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
            matchingFallbacks = ["debug"]
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
