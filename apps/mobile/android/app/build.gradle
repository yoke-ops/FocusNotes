apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    autolinkLibrariesWithApp()
}

android {
    namespace "com.focusnotes"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.focusnotes"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.5.0"
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(project.findProperty("FN_RELEASE_STORE_FILE") ?: "focusnotes-release.jks")
            storePassword project.findProperty("FN_RELEASE_STORE_PASSWORD") ?: ""
            keyAlias project.findProperty("FN_RELEASE_KEY_ALIAS") ?: "focusnotes"
            keyPassword project.findProperty("FN_RELEASE_KEY_PASSWORD") ?: ""
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        }
        qa {
            initWith debug
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
            matchingFallbacks = ["debug"]
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
